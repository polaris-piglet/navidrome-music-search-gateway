name: music-gateway
services:
  gateway:
    build: .
    image: music-gateway:local
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-4534}:4534"
    environment:
      NAV_URL: ${NAV_URL:?Set NAV_URL}
      DOWNLOAD_USERS: ${DOWNLOAD_USERS:-}
      EXPECTED_MOUNT_SOURCE: ${EXPECTED_MOUNT_SOURCE:?Set EXPECTED_MOUNT_SOURCE}
      EXPECTED_MOUNT_TYPE: ${EXPECTED_MOUNT_TYPE:-cifs}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - type: bind
        source: ${STATE_PATH:?Set STATE_PATH}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${STAGING_PATH:?Set STAGING_PATH}
        target: /staging
        bind:
          create_host_path: false
      - type: bind
        source: ${MUSIC_PATH:?Set MUSIC_PATH}
        target: /music
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    restart: "no"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4534/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
